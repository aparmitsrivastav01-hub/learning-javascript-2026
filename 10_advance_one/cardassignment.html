<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>assignment</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #121212;
      }

      .card {
        width: 300px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-8px);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .card-content {
        padding: 20px;
      }

      .card-content h2 {
        margin-bottom: 10px;
      }

      .card-content p {
        color: #555;
        margin-bottom: 15px;
      }

      .btn {
        display: inline-block;
        padding: 10px 18px;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        border-radius: 8px;
      }
      .extract-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .extract-btn:hover {
        transform: translateY(-2px);
      }

      .extract-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>

  <button id="extract-btn">Extract Data</button>

  <body style="background-color: #212121"></body>
  <script>
    document
      .querySelector("#extract-btn")
      .addEventListener("click", function (e) {
        document.body.innerHTML = `<div class="card">
    <img id="image"src="https://picsum.photos/300/180" >

    <div class="card-content">
      <h2 id="name">Aparmit</h2>
      <p>Total Followers: </p>
      <a id= "button" class="btn"></a>
    </div>
  </div>`;
        requestURL = "https://api.github.com/users/aparmitsrivastav01-hub";
        const xhr = new XMLHttpRequest();
        xhr.open("GET", requestURL);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            const dataset = JSON.parse(this.response);
            document.getElementById("image").src = dataset.avatar_url
            if (dataset.name != "") {
              document.getElementById("name").innerText = dataset.name;
            }
            if (dataset.followers>=0) {
              document.getElementById("button").innerText = dataset.followers;
            }
          }
        };

        xhr.send();
      });
  </script>
</html>
